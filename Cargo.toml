[workspace]
resolver = "2"
members = [
    "backend/programs/verifier",
    "backend/programs/compliance",
    "backend/crates/wisp-crypto",
    "backend/crates/wisp-types",
    "backend/crates/issuer-core",
    "backend/crates/issuer-service",
]

[workspace.dependencies]
soroban-sdk = "25.1.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
