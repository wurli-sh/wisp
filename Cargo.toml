[workspace]
resolver = "2"
members = [
    "contracts/verifier",
    "contracts/compliance",
    "contracts/mock-sac",
    "crates/amoeba-crypto",
    "crates/amoeba-types",
    "crates/issuer-service",
]

[workspace.dependencies]
soroban-sdk = "25.1.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
