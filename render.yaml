services:
  - type: web
    name: wisp-issuer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/crates/issuer-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ISSUER_REQUIRE_DB
        value: "1"
      - key: WISP_ENV
        value: production
      - key: ISSUER_MODE
        value: production
      - key: WISP_FIXTURE_PROFILE
        value: disabled
      - key: WISP_FIXTURES_DIR
        value: /app/bindings/fixtures
      - key: KYC_MODE
        value: sep10
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: PROVIDER_WEBHOOK_SECRETS
        sync: false
      - key: VERIFIER_CONTRACT_ID
        value: CAEJ63XT46UUNCJNZS5IWVLQQSOV3FHCEHJMFJZHAYA4BTBIWQAJKZZ2
      - key: COMPLIANCE_CONTRACT_ID
        value: CDISQDZ6MUT5KCSP4WRPWJAETN7XA7XOXEL5W2DZ6LZ35USNY3RC6OJN
      - key: EXPECTED_VK_HASH
        value: 3ea87034b94f427de47c7884cee93c3dea107d579a6b90e04b7343ebac222319
      - key: ISSUER_PUBLIC_KEY
        value: GA2R4CVM7W2R62S7ZXTPPMSPAUPSSHAS2VRI4BHUPALAQGQDQLVDY7BX
      - key: ISSUER_PUBLIC_URL
        value: https://wisp-issuer-vekn.onrender.com
      - key: WEB_AUTH_DOMAIN
        value: wisp-issuer-vekn.onrender.com
      # Set in Render dashboard (secrets):
      # SUPABASE_DB_URL — Session pooler URI (not db.*.supabase.co — IPv6 fails on Render)
      # Supabase → Connect → Session pooler → URI + ?sslmode=require
      # ISSUER_API_TOKEN — Bearer token for /admin/*
      # ISSUER_SECRET_KEY — wisp-issuer Stellar secret (root publish); or PUBLISH_SOURCE_ACCOUNT
      # ADMIN_PUBLIC_KEY — amoeba-admin G-address (optional, for admin-signed publish)
