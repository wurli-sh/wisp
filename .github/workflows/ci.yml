name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  zk-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Rust audit tooling
        run: cargo install cargo-audit --locked

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked --version 25.2.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm install --prefix packages/amoeba-crypto
          npm install --prefix circuits/circom

      - name: Generate bindings and check drift
        run: |
          node bindings/scripts/generate.mjs
          git diff --exit-code bindings/generated/

      - name: Generate crypto fixtures and check drift
        run: |
          node bindings/scripts/gen-crypto-fixtures.mjs
          node bindings/scripts/gen-addresses.mjs
          git diff --exit-code bindings/fixtures/crypto.json bindings/fixtures/addresses.json

      - name: Bindings tests
        run: pnpm test:bindings

      - name: Phase 2 crate tests
        run: cargo test -p amoeba-crypto -p amoeba-types -p issuer-service

      - name: Dependency audits
        run: |
          pnpm audit --audit-level moderate
          cargo audit

      - name: Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Contract tests
        run: cargo test -p verifier -p compliance -p mock-sac

      - name: Circuit fixture checks
        run: ./circuits/circom/test/verify-fixtures.sh

      - name: Circuit unit tests
        run: pnpm test:circuit

      - name: Local proof verification
        run: ./circuits/circom/scripts/verify-local.sh

      - name: Ceremony gate tests
        run: |
          pnpm test:ceremony
          python3 circuits/circom/scripts/compute-vk-hash.py > /dev/null

      - name: Soroban build
        run: stellar contract build
