# Publish @amoeba_/* to npm on version tags.
# Paused: manual dispatch only until re-enabled.
# Deploy is elsewhere: Vercel (frontend), Render (issuer-service).
# Requires GitHub secret NPM_TOKEN (granular token with bypass 2FA + @amoeba_ publish).
name: release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: ./scripts/publish/publish-packages.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
