[package]
name = "compliance"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "hazmat-address"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
verifier = { path = "../verifier" }
