[package]
name = "issuer-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wisp-crypto = { path = "../wisp-crypto" }
wisp-types = { path = "../wisp-types" }
ark-bn254 = "0.6"
async-trait = "0.1"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-strkey = "0.0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
