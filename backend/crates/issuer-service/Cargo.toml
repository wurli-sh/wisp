[package]
name = "issuer-service"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "issuer-service"
path = "src/main.rs"

[dependencies]
amoeba-crypto = { path = "../amoeba-crypto" }
amoeba-types = { path = "../amoeba-types" }
ark-bn254 = "0.6"
ark-ff = "0.6"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
